<!DOCTYPE html>
<html lang="uz">
<head>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>

        .card { background: var(--tg-theme-secondary-bg-color, #fff); padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 12px; text-align: left; }
        .card h3 { margin-bottom: 8px; font-size: 18px; }
        .card p { font-size: 14px; color: #666; margin-bottom: 12px; }
        .btn { display: block; width: 100%; padding: 12px; background: var(--tg-theme-button-color, #2ea44f); color: var(--tg-theme-button-text-color, #fff); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }

</head>

        <h1>JOB BY UZ</h1>
